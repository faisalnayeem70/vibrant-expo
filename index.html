<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibrant Expo — Visitor Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 28%, #d9c2ff 62%, #b8f1f0 100%);
      background-attachment: fixed;
      color: #222;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 12px 36px rgba(79, 36, 115, 0.16);
      border-top: 6px solid transparent;
      border-image: linear-gradient(90deg, #ff5f6d, #ffc371, #7b61ff, #18c8c8) 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 2px 0 4px;
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1.04;
      letter-spacing: -1px;
      font-weight: 900;
      color: #7415b8;
      -webkit-text-stroke: 0;
      text-shadow: none;
    }

    .brand p {
      margin: 8px 0 0;
      color: #777;
      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    .family-options {
      display: flex;
      gap: 10px;
    }

    .family-option {
      flex: 1;
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      padding: 13px;
      text-align: center;
      cursor: pointer;
    }

    .family-option input {
      width: auto;
      margin-right: 7px;
    }

    .hidden {
      display: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e9f8ee;
      color: #146c2e;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a21d1d;
    }

    .ticket {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 14px;
      text-align: center;
    }

    .ticket h2 {
      margin-top: 0;
    }

    .ticket-number {
      font-size: 26px;
      font-weight: 800;
      margin: 12px 0;
    }

    .presenter-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin: 0 0 5px;
    }

    .presented-by {
      display: block;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #c2185b;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.4;
      letter-spacing: 0.35px;
      text-shadow: none;
      text-transform: none;
    }

    .alice-brand {
      font-family: "Alice", Georgia, serif;
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      color: #7b2f66;
      text-shadow: none;
      display: inline-block;
      line-height: 1.2;
    }

    .event-details {
      margin: 12px 0 0;
      padding: 14px 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fff3c5 0%, #ffd9ec 48%, #d9f4ff 100%);
      border: 1px solid rgba(123, 97, 255, 0.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .season-label {
      color: #7044c8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .visitor-registration {
      margin: 0 0 10px;
      color: #666078;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .form-subtitle {
      text-align: center;
      margin: 0 0 18px;
      font-size: 15px;
      color: #666078;
    }

    .event-date {
      color: #b77700;
      font-size: clamp(17px, 4vw, 22px);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 7px;
      text-shadow: none;
    }

    .event-venue {
      color: #075fb0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 9px;
      text-shadow: none;
    }

    .entry-note {
      color: #b12c65;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 15px 10px;
      }

      .card {
        padding: 24px 18px;
      }

      .brand h1 {
        font-size: 26px;
      }
    }

    /* Hide fields visually while retaining their existing HTML and integration */
    #registrationForm .field:has(#mobile),
    #registrationForm .field:has(#gender),
    #registrationForm .field:has(#city),
    #registrationForm .field:has(input[name="family"]) {
      display: none !important;
    }

  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="brand">
        <div class="presenter-lockup">
          <span class="alice-brand">Vv collections</span>
          <span class="presented-by">Presents</span>
        </div>
        <h1>VIBRANT EXPO</h1>
        <div class="event-details">
          <div class="season-label">SEASON 01</div>
          <div class="event-date">Sunday, 1 November 2026</div>
          <div class="event-venue">📍 KINGS CLASSIC GARDEN<br>Gudimalkapur</div>
          <div class="entry-note">FREE ENTRY · REGISTER FOR YOUR TICKET</div>
        </div>
      </div>

      <p class="visitor-registration form-subtitle">Visitor Registration</p>

      <form id="registrationForm">

        <div class="field">
          <label for="fullName">Full Name</label>
          <input
            id="fullName"
            type="text"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input
            id="mobile"
            type="tel"
            placeholder="Enter mobile number"
            inputmode="numeric"
            required
          >
        </div>

        <div class="field">
          <label for="whatsapp">WhatsApp Number</label>
          <input
            id="whatsapp"
            type="tel"
            placeholder="Enter WhatsApp number"
            inputmode="numeric"
            required
          >
        </div>

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>

        <div class="field">
          <label for="city">City</label>
          <input
            id="city"
            type="text"
            value="Hyderabad"
            placeholder="Enter your city"
          >
        </div>

        <div class="field">
          <label for="source">How did you hear about us?</label>
          <select id="source">
            <option value="">Select source</option>
            <option value="Instagram">Instagram</option>
            <option value="YouTube">YouTube</option>
            <option value="Pamphlet">Pamphlet</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Facebook">Facebook</option>
            <option value="Friend / Family">Friend / Family</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">

          <label>Are you coming with family?</label>

          <div class="family-options">

            <label class="family-option">
              <input
                type="radio"
                name="family"
                value="yes"
                checked
              >
              Yes
            </label>

            <label class="family-option">
              <input
                type="radio"
                name="family"
                value="no"
              >
              No
            </label>

          </div>

        </div>

        <div class="field" id="companionsField">

          <label for="companions">
            Number of people coming with you to the event
          </label>

          <input
            id="companions"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            placeholder="Enter number of people"
            value="2"
          >

        </div>

        <button type="submit">
          REGISTER
        </button>

      </form>

      <div id="message" class="message"></div>

      <div id="ticket" class="ticket">

        <h2>Registration Successful</h2>

        <p>Your ticket number is:</p>

        <div id="ticketNumber" class="ticket-number"></div>

        <p id="expectedPeople"></p>
        <p>Scan this QR code at the entrance</p>
<div id="ticketQR" style="margin: 20px auto;"></div>

      </div>

    </div>

  </div>

  <script>
    // The normal mobile field stays in the HTML but is hidden from visitors.
    // Use the visible WhatsApp number for the existing required database parameter.
    document.getElementById("mobile").required = false;

    
    const familyInputs = document.querySelectorAll(
      'input[name="family"]'
    );

    const companionsField =
      document.getElementById("companionsField");

    familyInputs.forEach(input => {

      input.addEventListener("change", () => {

        if (input.value === "yes" && input.checked) {
          companionsField.classList.remove("hidden");
        }

        if (input.value === "no" && input.checked) {
          companionsField.classList.add("hidden");
        }

      });

    });

    const SUPABASE_URL = "https://jzfjizjldcazysnqlpjr.supabase.co";
const SUPABASE_KEY = "sb_publishable_V5bTKaoMgbrBx6ic8EuX6g_euN9COX8";

document
  .getElementById("registrationForm")
  .addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const message = document.getElementById("message");
    const button = form.querySelector('button[type="submit"]');
    const ticket = document.getElementById("ticket");

    const family = document.querySelector(
      'input[name="family"]:checked'
    ).value === "yes";

    const params = new URLSearchParams(window.location.search);
    const sourceToken =
      params.get("source_token") ||
      params.get("source") ||
      "";

    const companions = family
      ? Math.max(0, parseInt(
          document.getElementById("companions").value || "0",
          10
        ))
      : 0;

    message.className = "message";
    message.style.display = "block";
    message.textContent = "Registering your visit...";

    button.disabled = true;
    button.textContent = "PLEASE WAIT";
    ticket.style.display = "none";

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/register_visitor`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify({
            p_full_name: document.getElementById("fullName").value.trim(),
            p_mobile_number: document.getElementById("whatsapp").value.trim(),
            p_whatsapp_number: document.getElementById("whatsapp").value.trim(),
            p_gender: document.getElementById("gender").value,
            p_city: document.getElementById("city").value.trim(),
            p_source_token: sourceToken || null,
            p_manual_source: document.getElementById("source").value || null,
            p_coming_with_family: family,
            p_companions_count: companions
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.message || result.details || result.hint ||
          "Registration failed. Please try again."
        );
      }

      const registration = Array.isArray(result)
        ? result[0]
        : result;

      if (!registration || !registration.ticket_number) {
        throw new Error("Registration response was incomplete.");
      }
const qrBox = document.getElementById("ticketQR");
qrBox.innerHTML = "";

const qrImage = document.createElement("img");
qrImage.alt = "Vibrant Expo ticket QR code";
qrImage.width = 200;
qrImage.height = 200;
qrImage.src =
  "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
  encodeURIComponent(registration.ticket_token);

qrBox.appendChild(qrImage);
      document.getElementById("ticketNumber").textContent =
        registration.ticket_number;

      document.getElementById("expectedPeople").textContent =
        `Expected visitors: ${registration.expected_people}`;

      ticket.style.display = "block";
      message.className = "message success";
      message.textContent =
        "Registration successful! Your ticket is ready.";

      form.reset();
      document.getElementById("city").value = "Hyderabad";

    } catch (error) {
      message.className = "message error";
      message.textContent =
        error.message || "Something went wrong. Please try again.";
    } finally {
      button.disabled = false;
      button.textContent = "REGISTER";
    }
  });
    
  </script>

</body>
</html>
