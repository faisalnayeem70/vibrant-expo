<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibrant Expo — Visitor Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #777;
      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    .family-options {
      display: flex;
      gap: 10px;
    }

    .family-option {
      flex: 1;
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      padding: 13px;
      text-align: center;
      cursor: pointer;
    }

    .family-option input {
      width: auto;
      margin-right: 7px;
    }

    .hidden {
      display: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e9f8ee;
      color: #146c2e;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a21d1d;
    }

    .ticket {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 14px;
      text-align: center;
    }

    .ticket h2 {
      margin-top: 0;
    }

    .ticket-number {
      font-size: 26px;
      font-weight: 800;
      margin: 12px 0;
    }

    @media (max-width: 480px) {
      .page {
        padding: 15px 10px;
      }

      .card {
        padding: 24px 18px;
      }

      .brand h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="brand">
        <h1>VIBRANT EXPO</h1>
        <p>Visitor Registration</p>
      </div>

      <form id="registrationForm">

        <div class="field">
          <label for="fullName">Full Name</label>
          <input
            id="fullName"
            type="text"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input
            id="mobile"
            type="tel"
            placeholder="Enter mobile number"
            inputmode="numeric"
            required
          >
        </div>

        <div class="field">
          <label for="whatsapp">WhatsApp Number</label>
          <input
            id="whatsapp"
            type="tel"
            placeholder="Enter WhatsApp number"
            inputmode="numeric"
          >
        </div>

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>

        <div class="field">
          <label for="city">City</label>
          <input
            id="city"
            type="text"
            value="Hyderabad"
            placeholder="Enter your city"
          >
        </div>

        <div class="field">
          <label for="source">How did you hear about us?</label>
          <select id="source">
            <option value="">Select source</option>
            <option value="Instagram">Instagram</option>
            <option value="YouTube">YouTube</option>
            <option value="Pamphlet">Pamphlet</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Facebook">Facebook</option>
            <option value="Friend / Family">Friend / Family</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">

          <label>Are you coming with family?</label>

          <div class="family-options">

            <label class="family-option">
              <input
                type="radio"
                name="family"
                value="yes"
                checked
              >
              Yes
            </label>

            <label class="family-option">
              <input
                type="radio"
                name="family"
                value="no"
              >
              No
            </label>

          </div>

        </div>

        <div class="field" id="companionsField">

          <label for="companions">
            Number of people coming with you to the event
          </label>

          <input
            id="companions"
            type="number"
            min="0"
            value="2"
          >

        </div>

        <button type="submit">
          REGISTER
        </button>

      </form>

      <div id="message" class="message"></div>

      <div id="ticket" class="ticket">

        <h2>Registration Successful</h2>

        <p>Your ticket number is:</p>

        <div id="ticketNumber" class="ticket-number"></div>

        <p id="expectedPeople"></p>

      </div>

    </div>

  </div>

  <script>
    const familyInputs = document.querySelectorAll(
      'input[name="family"]'
    );

    const companionsField =
      document.getElementById("companionsField");

    familyInputs.forEach(input => {

      input.addEventListener("change", () => {

        if (input.value === "yes" && input.checked) {
          companionsField.classList.remove("hidden");
        }

        if (input.value === "no" && input.checked) {
          companionsField.classList.add("hidden");
        }

      });

    });

    const SUPABASE_URL = "https://jzfjizjldcazysnqlpjr.supabase.co";
const SUPABASE_KEY = "sb_publishable_V5bTKaoMgbrBx6ic8EuX6g_euN9COX8";.

document
  .getElementById("registrationForm")
  .addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const message = document.getElementById("message");
    const button = form.querySelector('button[type="submit"]');
    const ticket = document.getElementById("ticket");

    const family = document.querySelector(
      'input[name="family"]:checked'
    ).value === "yes";

    const params = new URLSearchParams(window.location.search);
    const sourceToken =
      params.get("source_token") ||
      params.get("source") ||
      "";

    const companions = family
      ? Math.max(0, parseInt(
          document.getElementById("companions").value || "0",
          10
        ))
      : 0;

    message.className = "message";
    message.style.display = "block";
    message.textContent = "Registering your visit...";

    button.disabled = true;
    button.textContent = "PLEASE WAIT";
    ticket.style.display = "none";

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/register_visitor`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify({
            p_full_name: document.getElementById("fullName").value.trim(),
            p_mobile_number: document.getElementById("mobile").value.trim(),
            p_whatsapp_number: document.getElementById("whatsapp").value.trim(),
            p_gender: document.getElementById("gender").value,
            p_city: document.getElementById("city").value.trim(),
            p_source_token: sourceToken || null,
            p_manual_source: document.getElementById("source").value || null,
            p_coming_with_family: family,
            p_companions_count: companions
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.message || result.details || result.hint ||
          "Registration failed. Please try again."
        );
      }

      const registration = Array.isArray(result)
        ? result[0]
        : result;

      if (!registration || !registration.ticket_number) {
        throw new Error("Registration response was incomplete.");
      }

      document.getElementById("ticketNumber").textContent =
        registration.ticket_number;

      document.getElementById("expectedPeople").textContent =
        `Expected visitors: ${registration.expected_people}`;

      ticket.style.display = "block";
      message.className = "message success";
      message.textContent =
        "Registration successful! Your ticket is ready.";

      form.reset();
      document.getElementById("city").value = "Hyderabad";

    } catch (error) {
      message.className = "message error";
      message.textContent =
        error.message || "Something went wrong. Please try again.";
    } finally {
      button.disabled = false;
      button.textContent = "REGISTER";
    }
  });
  </script>

</body>
</html>
